<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Singapore Project - Orchard Road</title>
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="Ride a scooter down a real Orchard Road, built from open map data.">
<style>
  html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;left:calc(8px + env(safe-area-inset-left));bottom:8px;
    font:11px/1.35 ui-monospace,Menlo,monospace;color:#e4e9ee;
    background:rgba(10,14,18,.6);padding:6px 8px;border-radius:3px;pointer-events:none}
  /* landscape only: the controls assume two thumbs on the short edges */
  #rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;
    background:#12161b;color:#e8e2d4;font:15px/1.6 ui-monospace,Menlo,monospace;
    padding:24px;z-index:50}
  #rotate span{display:block;font-size:34px;margin-bottom:14px}
  #place{position:fixed;left:50%;transform:translateX(-50%);top:10px;
    font:600 13px/1.3 ui-sans-serif,system-ui,-apple-system,Helvetica,Arial;
    letter-spacing:.04em;color:#f2ece0;background:rgba(10,14,18,.6);
    padding:7px 14px;border-radius:20px;pointer-events:none;white-space:nowrap;
    text-align:center}
  /* second line: the street and which way you are pointing, in words, so the
     map does not have to be decoded to know where you are */
  #place small{display:block;font-weight:500;font-size:11px;letter-spacing:.02em;
    opacity:.72;margin-top:2px}
  #map{position:fixed;right:calc(10px + env(safe-area-inset-right));top:10px;
    width:124px;height:124px;border-radius:8px;pointer-events:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.4)}
  /* sits INSIDE the map rather than under it: outside, it was a grey caption
     floating over the street with nothing obviously attaching it to the map */
  #maphint{position:fixed;right:calc(10px + env(safe-area-inset-right));top:112px;
    width:124px;text-align:center;
    font:600 9px/1 ui-sans-serif,system-ui,Helvetica,Arial;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(240,235,222,.62);pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.9)}
  /* the expanded map: the whole street, named, with you on it */
  #big{position:fixed;inset:0;z-index:40;display:none;background:#0b0e11}
  #big.on{display:block}
  /* the rest of the interface is not just dimmed behind the map, it is gone:
     a control legend and a frame counter showing through a map make it
     unreadable, and none of it is usable while the map is up */
  body.mapopen #hud,body.mapopen #place,body.mapopen #map,
  body.mapopen #maphint,body.mapopen #modebtn,body.mapopen #vehiclebtn,
  body.mapopen #pedals,body.mapopen #steerhint,
  body.mapopen #stick,body.mapopen #lookhint{display:none}
  #bigmap{position:absolute;inset:0;width:100%;height:100%}
  #bigclose{position:absolute;right:calc(12px + env(safe-area-inset-right));
    top:12px;font:600 12px/1 ui-sans-serif,system-ui,Helvetica,Arial;
    letter-spacing:.06em;color:#12161b;background:#e8ddc6;border:0;
    padding:11px 16px;border-radius:20px}
  #bigkey{position:absolute;left:calc(14px + env(safe-area-inset-left));
    bottom:calc(12px + env(safe-area-inset-bottom));
    font:500 11px/1.6 ui-sans-serif,system-ui,Helvetica,Arial;
    color:rgba(240,235,222,.62);pointer-events:none}
  #bigkey b{color:#ffd696;font-weight:600}
  /* The open map used to close on any tap, so it could not be zoomed at all:
     the first touch aimed at the map dismissed it. It closes on the Close
     button now, and the map itself pinches and drags. */
  #bigzoom{position:absolute;right:calc(12px + env(safe-area-inset-right));
    top:64px;display:flex;flex-direction:column;gap:8px}
  #bigzoom button{width:44px;height:44px;font:600 20px/1 ui-sans-serif,system-ui,Helvetica,Arial;
    color:#12161b;background:#e8ddc6;border:0;border-radius:22px;
    box-shadow:0 2px 8px rgba(0,0,0,.35)}
  #bigzoom button:active{background:#cfc4ad}
  /* ONE small teleport pill that opens a dropdown list — a row of seven
     pills covered the map on a phone (user feedback, 2026-07-30) */
  #tpbar{position:absolute;left:calc(12px + env(safe-area-inset-left));
    top:12px;z-index:3}
  #tpbtn{font:600 11px/1 ui-sans-serif,system-ui,Helvetica,Arial;
    letter-spacing:.05em;text-transform:uppercase;color:#12161b;
    background:#e8ddc6;border:0;padding:10px 13px;border-radius:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.35)}
  #tpbtn:active{background:#cfc4ad}
  #tplist{display:none;margin-top:8px;flex-direction:column;gap:2px;
    background:rgba(16,20,24,.96);border:1px solid rgba(232,221,198,.22);
    border-radius:14px;padding:5px;max-height:min(62vh,340px);overflow-y:auto;
    -webkit-overflow-scrolling:touch;width:max-content}
  #tplist.on{display:flex}
  #tplist button{font:500 13px/1 ui-sans-serif,system-ui,Helvetica,Arial;
    color:#e8ddc6;background:none;border:0;text-align:left;
    padding:11px 14px 11px 11px;border-radius:9px;white-space:nowrap}
  #tplist button:active{background:#e8ddc6;color:#12161b}
  #vehiclebtn{position:fixed;right:calc(10px + env(safe-area-inset-right));
    bottom:calc(52px + env(safe-area-inset-bottom));
    font:600 11px/1 ui-sans-serif,-apple-system,Helvetica,Arial;
    letter-spacing:.03em;color:#12161b;background:rgba(232,221,198,.88);border:0;
    padding:8px 13px;border-radius:16px;box-shadow:0 1px 6px rgba(0,0,0,.3)}
  #vehiclebtn:active{background:#cfc4ad}
  @media (orientation:portrait){ #vehiclebtn{display:none} }
  #modebtn{position:fixed;right:calc(10px + env(safe-area-inset-right));
    bottom:calc(12px + env(safe-area-inset-bottom));
    font:600 11px/1 ui-sans-serif,system-ui,-apple-system,Helvetica,Arial;
    letter-spacing:.03em;color:#12161b;background:rgba(232,221,198,.88);border:0;
    padding:8px 13px;border-radius:16px;box-shadow:0 1px 6px rgba(0,0,0,.3)}
  #modebtn:active{background:#cfc4ad}
  #stick{position:fixed;left:38px;bottom:38px;width:108px;height:108px;
    border-radius:50%;border:2px solid rgba(232,221,198,.5);
    background:rgba(12,16,20,.28);display:none;pointer-events:none}
  #stick.on{display:block}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
    border-radius:50%;background:rgba(232,221,198,.82);
    box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .04s linear}
  #lookhint{position:fixed;right:0;top:0;bottom:0;width:50%;display:none;
    pointer-events:none;align-items:center;justify-content:center;
    font:600 12px/1.4 ui-sans-serif,system-ui,Helvetica,Arial;
    color:rgba(240,235,222,.28);letter-spacing:.14em;text-transform:uppercase}
  #lookhint.on{display:flex}
  /* GHOST PEDALS: the ride controls are invisible zones, and a first-time
     thumb has nothing to find. These are indications, not buttons — faint
     cream outlines at the real zones, pointer-events none so the true touch
     layer underneath stays the input; they brighten while pressed so the
     press reads. Ride mode + touch only; the walk stick replaces them. */
  /* The REAL ride zones: the whole left half, split at 62% of the screen
     height — throttle above, brake below (input.js readInput). The ghosts
     now tell that truth: a faint divider AT the split, and a glyph centred
     in each true zone, instead of two decorative boxes that matched
     nothing (the first version; the user pressed where they showed and
     the input disagreed). */
  #pedals{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
  #pedals.on{display:block}
  .pedal{position:absolute;width:54px;height:54px;border-radius:50%;
    border:1.5px solid rgba(232,221,198,.20);background:rgba(12,16,20,.10);
    display:grid;place-items:center;transition:border-color .12s,background .12s}
  #pedalgo{left:9%;top:31%;transform:translate(-50%,-50%)}
  #pedalstop{left:9%;top:81%;transform:translate(-50%,-50%)}
  .pedal.hot{border-color:rgba(232,221,198,.55);background:rgba(232,221,198,.10)}
  .pedal i{display:block;border:solid rgba(232,221,198,.34);border-width:0 2.5px 2.5px 0;
    padding:5px;transform:rotate(-135deg);margin-top:6px}
  .pedal.brakeface i{transform:rotate(45deg);margin-top:-6px}
  .pedal.hot i{border-color:rgba(232,221,198,.8)}
  #steerhint{position:fixed;right:calc(18px + env(safe-area-inset-right));top:50%;
    transform:translateY(-50%);width:96px;height:26px;display:none;
    pointer-events:none;z-index:5}
  #steerhint.on{display:block}
  #steertrack{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;
    background:rgba(232,221,198,.18);border-radius:1px}
  #steerdot{position:absolute;left:50%;top:50%;width:12px;height:12px;
    margin:-6px 0 0 -6px;border-radius:50%;background:rgba(232,221,198,.42);
    transition:none}
  @media (orientation:portrait){ #pedals,#steerhint{display:none !important} }
  @media (orientation:portrait){ #rotate{display:grid} #place,#map,#maphint,#big,#modebtn,#stick,#lookhint{display:none} }
  /* The boot screen. The build blocks the main thread for seconds at a time,
     and a static "loading" line reads as a crash — so boot yields between
     phases (see bstep in main.js) and this bar moves with named steps. The
     track is drawn as a road: dark tarmac with faint lane dashes that the
     cream fill drives over. pointer-events stays none so a bug here can
     never brick the controls underneath. Sits UNDER #rotate (z 50). */
  #boot{position:fixed;inset:0;z-index:45;display:grid;place-items:center;
    background:#0b0d10;transition:opacity .45s ease;pointer-events:none}
  #boot.off{opacity:0}
  #boot .bwrap{width:min(420px,78vw)}
  #bootword{font:600 16px/1 ui-sans-serif,system-ui,-apple-system,Helvetica,Arial;
    letter-spacing:.34em;color:#e8ddc6;text-transform:uppercase;text-align:center}
  #bootsub{font:500 10px/1.5 ui-sans-serif,system-ui,Helvetica,Arial;
    letter-spacing:.14em;color:rgba(232,221,198,.5);text-transform:uppercase;
    text-align:center;margin:7px 0 24px}
  #bootbar{position:relative;height:5px;border-radius:3px;overflow:hidden;
    background:repeating-linear-gradient(90deg,#161b20 0 16px,#232a31 16px 24px)}
  #bootfill{position:absolute;left:0;top:0;bottom:0;width:0%;
    background:#e8ddc6;border-radius:3px;transition:width .25s ease}
  #bootrow{display:flex;justify-content:space-between;gap:12px;margin-top:10px;
    font:11px/1.4 ui-monospace,Menlo,monospace;color:rgba(228,233,238,.72)}
</style>
<canvas id="c"></canvas>
<div id="rotate"><div><span>&#8635;</span>Turn your phone sideways<br><small style="opacity:.6">this rides in landscape</small></div></div>
<div id="place">Orchard Road<small id="where"></small></div>
<canvas id="map" width="248" height="248"></canvas>
<div id="maphint">tap map</div>
<div id="big">
    <div id="tpbar">
      <button id="tpbtn">Teleport</button>
      <div id="tplist"></div>
    </div>
  <canvas id="bigmap"></canvas>
  <button id="bigclose" type="button">Close</button>
  <div id="bigkey"><b>&#9679;</b> you<br>
    <span style="opacity:.75">pinch or drag to zoom &middot; Close when done</span></div>
  <div id="bigzoom">
    <button id="zoomin" type="button">+</button>
    <button id="zoomout" type="button">&minus;</button>
  </div>
</div>
<div id="hud">loading Orchard…</div>
<div id="boot"><div class="bwrap">
  <div id="bootword">Singapore</div>
  <div id="bootsub">Orchard Road &middot; Bras Basah &middot; Marina Bay</div>
  <div id="bootbar"><i id="bootfill"></i></div>
  <div id="bootrow"><span id="bootlab">reading the map&hellip;</span><span id="bootpct"></span></div>
</div></div>
<div id="stick"><div id="knob"></div></div>
<div id="pedals">
  <div class="pedal" id="pedalgo"><i></i></div>
  <div class="pedal brakeface" id="pedalstop"><i></i></div>
</div>
<div id="steerhint"><div id="steertrack"></div><div id="steerdot"></div></div>
<div id="lookhint">drag to look</div>
<button id="vehiclebtn" type="button">Car</button>
<button id="modebtn" type="button">Get off</button>
<script type="module" src="./app.js"></script>
