# The Sentosa game's room relay — Cloudflare Workers + Durable Objects.
# Deploys to the propsightsg account (the one this machine's wrangler is
# logged into; owner-confirmed 2026-08-03). Free plan: DOs must be
# SQLite-backed, hence new_sqlite_classes in the migration.
name = "sentosa-relay"
main = "do.js"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
